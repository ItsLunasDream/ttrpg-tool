name: Build

on:
  push:
    branches: ['**']
  workflow_dispatch:
  release:
    types: [published]

jobs:
  test:
    name: Tests und Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  ui:
    name: Oberfläche und Markdown-Rundlauf
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      # Beide Tests fahren die gebaute Anwendung hoch. Die Tests oben laufen
      # gegen einzelne Module und sehen weder die Oberflaeche noch das Schema
      # des Editors.
      - name: Rauchtest
        run: npm run smoke
      - name: Markdown-Rundlauf
        run: npm run roundtrip
      # Die Huelle startet ihren eigenen Hauptprozess. Ihre Modultests sehen
      # nur reine Funktionen, nicht das Fenster.
      - name: Rauchtest der Huelle
        run: npm run smoke:shell
      # Nur das Web-Buendel. Der Tauri-Build braucht Systembibliotheken
      # (libgtk-3-dev, libwebkit2gtk-4.1-dev, ...), die hier fehlen; sein
      # Rust-Anteil bleibt vorerst ungeprueft in der CI. Der End-to-End-Lauf
      # unter e2e/ braucht einen installierten Browser und laeuft hier
      # ebenfalls noch nicht mit.
      - name: Kartenmacher-Bündel bauen
        run: npm run build -w apps/mapmaker

  package-check:
    name: Gepacktes Paket prüfen
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run icon
      - name: Linux-Paket bauen
        run: npm run dist:linux:dir
      # Faengt fehlende Abhaengigkeiten im asar-Paket ab. Die Tests oben
      # laufen gegen die Quelle und koennen das nicht sehen.
      - name: Gepackte Anwendung starten
        run: xvfb-run -a npm run verify:package -w apps/backstory -- "$PWD/apps/backstory/release/linux-unpacked/backstory-creator"
      - name: Log bei Fehler sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-verify-log
          path: apps/backstory/package-verify.log
          if-no-files-found: ignore
          retention-days: 1

  windows:
    name: Windows-Anwendung
    needs: package-check
    # Windows-Laeufer zaehlen doppelt auf das Kontingent. Die fertige
    # Anwendung wird nur dort gebaut, wo sie auch gebraucht wird: auf main,
    # fuer eine Veroeffentlichung und wenn jemand den Lauf von Hand startet.
    # Auf Zweigen genuegen die Tests darueber.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run icon
      - run: npm run dist:win
      - name: Gepackte Anwendung starten
        run: npm run verify:package -w apps/backstory -- "${{ github.workspace }}\apps\backstory\release\win-unpacked\Backstory Creator.exe"
      - name: Ergebnis hochladen
        uses: actions/upload-artifact@v4
        with:
          name: backstory-creator-windows
          path: apps/backstory/release/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: An Release anhängen
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: apps/backstory/release/*.exe
