name: Build

on:
  push:
    branches: ['**']
  workflow_dispatch:
  release:
    types: [published]

jobs:
  test:
    name: Tests und Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    name: Windows-Anwendung
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run icon
      - run: npm run dist:win
      - name: Ergebnis hochladen
        uses: actions/upload-artifact@v4
        with:
          name: backstory-creator-windows
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: An Release anhängen
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
